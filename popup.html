<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-app: #f8fafc;        /* Soft white/gray background */
      --bg-card: #ffffff;       /* Pure white card */
      --border: #e2e8f0;       /* Light border */
      --text-main: #0f172a;     /* Deep dark text */
      --text-muted: #64748b;    /* Cool gray text */
      --primary: #3b82f6;       /* Blue brand accent */
      --primary-hover: #1d4ed8; /* Darker blue */
      --del-bg: #fee2e2;        /* Soft red highlight */
      --del-text: #b91c1c;      /* Dark red text */
      --ins-bg: #dcfce7;        /* Soft green highlight */
      --ins-text: #15803d;      /* Dark green text */
    }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      padding: 16px;
      margin: 0;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      color: var(--primary);
    }

    h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
      flex-grow: 1;
      color: var(--text-main);
    }

    .tag {
      font-size: 9px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      background-color: rgba(59, 130, 246, 0.08);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 100px; 
      border: 1px solid rgba(59, 130, 246, 0.15);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      flex: 1;
      padding: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 8px; 
      transition: all 0.15s ease-in-out;
    }

    #save-btn {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 1px 2px rgba(59, 130, 246, 0.2);
    }

    #save-btn:hover {
      background-color: var(--primary-hover);
    }

    #compare-btn {
      background-color: var(--bg-card);
      color: var(--text-main);
      border-color: var(--border);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    #compare-btn:hover {
      background-color: var(--bg-app);
      border-color: #cbd5e1;
    }

    
    .history-selector-container {
      display: none;
      margin-top: 12px;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    select {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
      transition: border-color 0.15s ease;
    }

    select:focus {
      border-color: var(--primary);
    }

    #status {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
      text-align: center;
      margin-top: 12px;
      margin-bottom: 4px;
    }

    #result {
      display: none;
      border: 1px solid var(--border);
      border-radius: 12px; 
      background-color: var(--bg-card);
      margin-top: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    .diff-header {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 8px 12px;
      background-color: #f1f5f9; 
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
    }

    .diff-body {
      padding: 12px;
      font-size: 12px;
      line-height: 1.6;
      max-height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      color: var(--text-main);
    }

  
    .del {
      background-color: var(--del-bg);
      color: var(--del-text);
      text-decoration: line-through;
      padding: 2px 4px;
      border-radius: 4px;
      margin: 0 1px;
    }

    .ins {
      background-color: var(--ins-bg);
      color: var(--ins-text);
      font-weight: 500;
      padding: 2px 4px;
      border-radius: 4px;
      margin: 0 1px;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg class="logo-icon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" d="M2 12C5 5 19 5 22 12C19 19 5 19 2 12Z"></path>
      <circle cx="12" cy="12" r="4.5"></circle>
      <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
    </svg>
    <h3>Truth Hound</h3>
    <span class="tag">Engine v1.2</span>
  </div>

  <div class="btn-group">
    <button id="save-btn">Save Current</button>
    <button id="compare-btn">Check Changes</button>
  </div>

  <div class="history-selector-container" id="history-container">
    <label for="history-select">Compare Against:</label>
    <select id="history-select"></select>
  </div>

  <div id="status">Ready to scan.</div>

  <div id="result">
    <div class="diff-header" id="diff-header-text">Visual Comparison</div>
    <div id="diff-content" class="diff-body"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
